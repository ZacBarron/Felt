# Render Blueprint for Felt. See docs/DEPLOY.md.
# Persistent disks need a paid instance type (Starter or above).
services:
  - type: web
    name: felt
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    # SQLite lives on one disk, so the service runs one instance.
    numInstances: 1
    disk:
      name: felt-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: DATABASE_PATH
        value: /data/felt.sqlite
      # The address players use, for example https://felt.onrender.com.
      - key: APP_URL
        sync: false
      # Sign in emails through resend.com.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Passkeys: the domain the app's pages live on, and their exact origins.
      # For the GitHub Pages link: zacbarron.github.io and https://zacbarron.github.io
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGINS
        sync: false
      # Other sites that may call this API from a browser, comma separated.
      # For the GitHub Pages link: https://zacbarron.github.io
      - key: ALLOWED_ORIGINS
        sync: false
      # Study reminders: pnpm --filter @felt/server vapid
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Felt Pro through Stripe. Optional.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      # AI coach for Felt Pro players (console.anthropic.com). Optional: off without a key.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional coach settings. Defaults: claude-opus-5-5, medium, 40 messages a day.
      - key: COACH_MODEL
        sync: false
      - key: COACH_EFFORT
        sync: false
      - key: COACH_DAILY_LIMIT
        sync: false
      # Testing only: true gives every signed in player Felt Pro, coach included. Default false.
      - key: PRO_FOR_EVERYONE
        sync: false
