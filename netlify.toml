[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Client side routes all load the app; real files are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and entry files must always be checked, so updates reach players.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
