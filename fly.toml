# Fly.io config for Felt. See docs/DEPLOY.md.
# Change the app name to your own. It must be unique on Fly.
app = "felt-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  DATABASE_PATH = "/data/felt.sqlite"
  # The address players use. Change it when you add your own domain.
  APP_URL = "https://felt-app.fly.dev"
  # Passkeys (optional). The domain your pages are on and their exact origins.
  # Serving the app from this server: WEBAUTHN_RP_ID = "felt-app.fly.dev", WEBAUTHN_ORIGINS = "https://felt-app.fly.dev"
  # For the GitHub Pages link instead (or as well, add both origins):
  # WEBAUTHN_RP_ID = "zacbarron.github.io"
  # WEBAUTHN_ORIGINS = "https://zacbarron.github.io"
  # Sites that may call this API from a browser (CORS), comma separated:
  # ALLOWED_ORIGINS = "https://zacbarron.github.io"
  # AI coach settings (optional). The key is a secret: fly secrets set ANTHROPIC_API_KEY=sk-ant-...
  # COACH_MODEL = "claude-opus-5-5"
  # COACH_EFFORT = "medium"
  # COACH_DAILY_LIMIT = "40"

# One volume holds the SQLite file. Create it once: fly volumes create felt_data --size 1
[[mounts]]
  source = "felt_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep one machine running so study reminders go out on time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
